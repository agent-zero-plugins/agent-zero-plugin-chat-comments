# Operator-facing companion metadata. This file does NOT go inside the zip —
# it ships alongside it in the gate repo as plugins/<name>.meta.yaml.
#
# The gate's publish workflow enforces:
#   - meta.name == zip basename (this directory's name)
#   - meta.version == plugin.yaml's version (inside the zip)
#   - every env[].name is referenced by an os.getenv()/os.environ[] call
#     in the plugin source.
#
# See plugins/SCHEMA.md in agent-zero-vendor-plugins for the full schema.

name: my_plugin
version: "0.1.0"
summary: Replace this — one-line description for catalogs and pickers.

# env vars the plugin reads via os.getenv() / os.environ[...].
# Empty list = plugin needs nothing from the operator beyond its bundled
# default_config.yaml. Most plugins fall in this bucket.
env: []

# Declare here when the plugin reads operator-provided values:
# env:
#   - name: MY_PLUGIN_POLLING_INTERVAL_SECONDS
#     kind: config              # operator-provided literal
#     default: 60               # informational (used if operator doesn't override)
#     description: Seconds between automatic poll cycles.
#
#   - name: MY_PLUGIN_API_KEY
#     kind: secret              # operator-provided vault reference
#     description: |
#       API key for the upstream service. Operator pushes via:
#         pass insert a0/my-plugin-api-key
#       Then references in agent.plugins.oci[].secrets:
#         - { env: MY_PLUGIN_API_KEY, value-key: my-plugin-api-key }
