# Plugin author defaults — non-secret values only.
#
# NEVER put credentials here. The gate's publish workflow rejects any key
# matching: api_key, api-key, apikey, secret, token, password, credential,
# auth_key (case-insensitive). The whole zip is publicly readable to anyone
# with read:packages on the org — putting a secret here, even with a
# placeholder value, leaks the SHAPE of the secret and exposes A0's UI to
# rendering a settings prompt that would write the operator's input to
# config.json on the PVC.
#
# Operator-provided values come via env vars (chart's `config:` block).
# A0-UI-set values come via config.json on the PVC. Plugin code reads in
# order: env > config.json > default_config.yaml > literal default.

polling_interval_seconds: 60
backend: openai
debug: false
