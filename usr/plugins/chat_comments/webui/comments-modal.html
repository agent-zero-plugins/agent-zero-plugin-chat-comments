<html>
<head>
  <title>Chat Comments</title>
  <script type="module">
    import { store } from "/plugins/chat_comments/webui/chat-comments-store.js";
  </script>
</head>
<body>
  <div x-data>
    <template x-if="$store.chatComments">
      <div class="cc-modal-root">
        <template x-if="!$store.chatComments.comments.length">
          <p class="cc-modal-empty">No comments yet.</p>
        </template>
        <template x-if="$store.chatComments.comments.length">
          <ul class="cc-modal-list">
            <template x-for="c in $store.chatComments.comments" :key="c.id">
              <li class="cc-modal-item">
                <div class="cc-modal-item-main">
                  <template x-if="c.quoted_text">
                    <div
                      class="cc-modal-quote"
                      x-text="$store.chatComments.truncate(c.quoted_text, 90)"></div>
                  </template>
                  <template x-if="!c.quoted_text">
                    <div class="cc-modal-general-tag">General</div>
                  </template>
                  <div class="cc-modal-note" x-text="c.comment"></div>
                </div>
                <button
                  type="button"
                  class="cc-modal-del"
                  title="Delete comment"
                  aria-label="Delete comment"
                  @click="$store.chatComments.deleteComment(c.id)">
                  <span class="material-symbols-outlined">delete</span>
                </button>
              </li>
            </template>
          </ul>
        </template>

        <div class="cc-modal-add">
          <textarea
            class="cc-modal-add-input"
            rows="2"
            maxlength="2000"
            placeholder="Add a general comment (not tied to any text)…"
            x-model="$store.chatComments.newCommentDraft"
            @keydown.enter.meta.prevent="$store.chatComments.addGeneralComment()"
            @keydown.enter.ctrl.prevent="$store.chatComments.addGeneralComment()"></textarea>
          <button
            type="button"
            class="btn btn-ok cc-modal-add-btn"
            :disabled="!$store.chatComments.newCommentDraft.trim()"
            @click="$store.chatComments.addGeneralComment()">
            Add
          </button>
        </div>
      </div>
    </template>
  </div>

  <template x-if="$store.chatComments">
    <div class="modal-footer" data-modal-footer>
      <button class="btn btn-cancel" @click="$store.chatComments.closeCommentsModal()">
        Close
      </button>
      <button
        class="btn btn-ok"
        @click="$store.chatComments.sendAllToPrompt()"
        :disabled="!$store.chatComments.comments.length">
        Send to prompt
      </button>
    </div>
  </template>

  <style>
    .cc-modal-root {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
      margin: 1rem;
      min-width: 320px;
    }
    .cc-modal-empty {
      color: var(--color-text-secondary);
      margin: 1rem 0;
    }
    .cc-modal-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    .cc-modal-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid var(--color-border);
    }
    .cc-modal-item:last-child { border-bottom: none; }
    .cc-modal-item-main { flex: 1; min-width: 0; }
    .cc-modal-quote {
      color: var(--color-text-secondary);
      font-size: 0.85rem;
      border-left: 3px solid var(--color-border);
      padding-left: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cc-modal-note {
      color: var(--color-text);
      font-size: 0.92rem;
      margin-top: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .cc-modal-del {
      flex: 0 0 auto;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--color-text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 6px;
    }
    .cc-modal-del:hover {
      color: #ff6b6b;
      background: rgba(255, 255, 255, 0.08);
    }
    .cc-modal-del .material-symbols-outlined { font-size: 20px; }

    .cc-modal-general-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--color-text-secondary);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 1px 6px;
    }

    .cc-modal-add {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--color-border);
    }
    .cc-modal-add-input {
      flex: 1;
      resize: vertical;
      background: var(--color-background);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.9rem;
      box-sizing: border-box;
    }
    .cc-modal-add-btn { flex: 0 0 auto; }
  </style>
</body>
</html>
